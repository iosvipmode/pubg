<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro Game Store</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

/* Header */
header{
  background:linear-gradient(135deg,#6366f1,#06b6d4);
  padding:50px 20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:40px;
}

header input{
  margin-top:20px;
  padding:12px;
  width:60%;
  border:none;
  border-radius:10px;
  outline:none;
}

/* Categories */
.categories{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:20px;
}

.cat{
  padding:8px 15px;
  background:#1e293b;
  border-radius:20px;
  cursor:pointer;
  font-size:14px;
}

.cat:hover{
  background:#334155
