<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Store</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

.container{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  padding:30px;
}

.card{
  background:#111827;
  width:260px;
  border-radius:15px;
  overflow:hidden;
  transition:0.3s;
  box-shadow:0 10px 20px rgba(0,0,0,0.4);
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  height:150px;
  object-fit:cover;
  transition:0.3s;
}

.card img:hover{
  transform:scale(1.1);
}

.content{
  padding:15px;
}

.btn{
  display:inline-block;
  margin-top:10px;
  padding:8px 12px;
  background:#22c55e;
  color:white;
  text-decoration:none;
  border-radius:8px;
}
</style>

</head>

<body>

<div class="container">

  <div class="card">
    <img src="https://via.placeholder.com/300x150" alt="Game 1">
    <div class="content">
      <h2>Battle Game</h2>
      <p>Action multiplayer game</p>
      <a class="btn" href="#">Download</a>
    </div>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x150" alt="Game 2">
    <div class="content">
      <h2>Speed Racing</h2>
      <p>Fast racing experience</p>
      <a class="btn" href="#">Download</a>
    </div>
  </div>

</div>

</body>
</html>
