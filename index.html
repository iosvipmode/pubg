<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VIP Game Store</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

/* Header */
header{
  background:linear-gradient(135deg,#6366f1,#06b6d4);
  padding:60px 20px;
  text-align:center;
}

header h1{
  font-size:40px;
  margin:0;
}

input{
  margin-top:15px;
  padding:12px;
  width:60%;
  border:none;
  border-radius:10px;
}

/* Categories */
.menu{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:20px;
}

.menu div{
  background:#1e293b;
  padding:8px 15px;
  border-radius:20px;
  cursor:pointer;
}

/* Cards */
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#111827;
  padding:15px;
  border-radius:15px;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

.btn{
  display:inline-block;
  margin-top:10px;
  padding:10px;
  background:#22c55e;
  color:white;
  text-decoration:none;
  border-radius:8px;
}

footer{
  text-align:center;
  padding:20px;
  opacity:0.5;
}
</style>

</head>

<body>

<header>
  <h1>🔥 VIP Game Store</h1>
  <p>Fast • Clean • Official Games</p>
  <input placeholder="Search games...">
</header>

<div class="menu">
  <div>All</div>
  <div>Action</div>
  <div>Racing</div>
  <div>Online</div>
</div>

<div class="container">

  <div class="card">
    <h2>Battle Game</h2>
    <p>Online multiplayer action game.</p>
    <a class="btn" href="#">Download</a>
  </div>

  <div class="card">
    <h2>Speed Racing</h2>
    <p>High speed racing experience.</p>
    <a class="btn" href="#">Download</a>
  </div>

  <div class="card">
    <h2>Adventure World</h2>
    <p>Open world exploration game.</p>
    <a class="btn" href="#">Download</a>
  </div>

</div>

<footer>
  VIP Store © 2026
</footer>

</body>
</html>
